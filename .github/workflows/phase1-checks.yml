name: Phase 1 checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Frontend build
        run: npm run build

      - name: Backend syntax check
        run: npm run backend:check

      - name: Backend health smoke test
        shell: bash
        run: |
          node backend/src/server.js > /tmp/vr-api.log 2>&1 &
          pid=$!
          trap 'kill $pid 2>/dev/null || true' EXIT
          for i in {1..20}; do
            if curl --fail --silent http://127.0.0.1:3001/api/v1/health > /tmp/health.json; then
              cat /tmp/health.json
              exit 0
            fi
            sleep 1
          done
          cat /tmp/vr-api.log
          exit 1

      - name: Verify protected property data was not changed
        run: git diff --exit-code HEAD^ -- src/js/data/properties.js src/js/data/projectDetails.js
